<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Original</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        @font-face {
            font-family: 'FlappyFont';
            src: url('https://fonts.cdnfonts.com/s/17380/04B_19.woff') format('woff');
        }
        body {
            background-color: #313338;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 432px;
            max-height: 768px;
            background: #4ec0ca; /* Fallback sky blue */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
        #score-display, #loading-text {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'FlappyFont', monospace;
            font-size: 3.5rem;
            color: white;
            text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
        #loading-text { font-size: 1.5rem; top: 45%; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="loading-text">LOADING ASSETS...</div>
        <div id="score-display"></div>
        <canvas id="canvas" width="288" height="512"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const loadingText = document.getElementById('loading-text');

        // --- ASSET LOADER (WITH DISCORD CORS FIX) ---
        function loadImg(src) {
            const img = new Image();
            img.crossOrigin = "Anonymous"; // Crucial for Discord Activities
            img.src = src;
            return img;
        }

        const baseURL = 'https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/';
        const sprites = {
            bg: loadImg(baseURL + 'background-day.png'),
            ground: loadImg(baseURL + 'base.png'),
            bird: [
                loadImg(baseURL + 'yellowbird-upflap.png'),
                loadImg(baseURL + 'yellowbird-midflap.png'),
                loadImg(baseURL + 'yellowbird-downflap.png')
            ],
            pipeTop: loadImg(baseURL + 'pipe-green.png'),
            pipeBottom: loadImg(baseURL + 'pipe-green.png'),
            getReady: loadImg(baseURL + 'message.png'),
            gameOver: loadImg(baseURL + 'gameover.png')
        };

        const audio = {
            wing: new Audio('https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/wing.wav'),
            point: new Audio('https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/point.wav'),
            hit: new Audio('https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/hit.wav'),
            die: new Audio('https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/die.wav'),
            swoosh: new Audio('https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/swoosh.wav')
        };

        // Fix Audio CORS 
        Object.values(audio).forEach(snd => snd.crossOrigin = "Anonymous");

        function playSfx(snd) {
            snd.currentTime = 0;
            snd.play().catch(e => console.log("Audio play blocked by browser policy"));
        }

        // Safe Draw to prevent canvas crashing if image is still downloading
        function drawImg(img, x, y, w, h) {
            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, x, y, w, h);
            }
        }

        // --- GAME VARIABLES ---
        let frames = 0;
        const RAD = Math.PI / 180;
        
        const state = { current: 0, getReady: 0, game: 1, over: 2 };
        let score = { best: localStorage.getItem('flappy_best') || 0, value: 0 };

        // --- GAME OBJECTS ---
        const bg = {
            sX: 0, sY: 0, w: 288, h: 512, x: 0, y: 0,
            draw() {
                drawImg(sprites.bg, this.x, this.y, this.w, this.h);
                drawImg(sprites.bg, this.x + this.w, this.y, this.w, this.h);
            },
            update() {
                if(state.current === state.game) this.x = (this.x - 0.5) % (this.w / 2);
            }
        };

        const ground = {
            w: 336, h: 112, x: 0, y: canvas.height - 112,
            draw() {
                drawImg(sprites.ground, this.x, this.y, this.w, this.h);
                drawImg(sprites.ground, this.x + this.w, this.y, this.w, this.h);
            },
            update() {
                if(state.current !== state.over) this.x = (this.x - 2) % (this.w / 2);
            }
        };

        const bird = {
            animation: [0, 1, 2, 1], frame: 0, x: 50, y: 150, w: 34, h: 24, radius: 12,
            gravity: 0.25, jump: -4.6, speed: 0, rotation: 0,
            
            draw() {
                let birdRef = sprites.bird[this.animation[this.frame]];
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                if (birdRef.complete && birdRef.naturalWidth > 0) {
                    ctx.drawImage(birdRef, -this.w/2, -this.h/2, this.w, this.h);
                }
                ctx.restore();
            },
            update() {
                let period = state.current === state.getReady ? 10 : 5;
                this.frame += frames % period === 0 ? 1 : 0;
                this.frame %= this.animation.length;

                if(state.current === state.getReady) {
                    this.y = 150 + Math.cos(frames * 0.1) * 5; 
                    this.rotation = 0;
                } else {
                    this.speed += this.gravity;
                    this.y += this.speed;

                    if(this.y + this.h/2 >= canvas.height - 112) {
                        this.y = canvas.height - 112 - this.h/2;
                        if(state.current === state.game) {
                            state.current = state.over;
                            playSfx(audio.hit);
                            setTimeout(() => playSfx(audio.die), 300);
                        }
                    }
                    if(this.y - this.h/2 <= 0) {
                        this.y = this.h/2;
                        this.speed = 0;
                    }

                    if(this.speed >= this.jump) {
                        this.rotation = Math.min(Math.PI / 2, this.rotation + 4 * RAD);
                        if(this.rotation === Math.PI / 2) this.frame = 1;
                    } else {
                        this.rotation = -25 * RAD;
                    }
                }
            },
            flap() {
                this.speed = this.jump;
                playSfx(audio.wing);
            },
            reset() { this.y = 150; this.speed = 0; this.rotation = 0; this.frame = 0; }
        };

        const pipes = {
            position: [], w: 52, h: 320, gap: 100, dx: 2,
            draw() {
                for(let i=0; i<this.position.length; i++) {
                    let p = this.position[i];
                    ctx.save();
                    ctx.translate(p.x + this.w/2, p.y + this.h/2);
                    ctx.scale(1, -1);
                    if (sprites.pipeTop.complete && sprites.pipeTop.naturalWidth > 0) {
                        ctx.drawImage(sprites.pipeTop, -this.w/2, -this.h/2, this.w, this.h);
                    }
                    ctx.restore();
                    drawImg(sprites.pipeBottom, p.x, p.y + this.h + this.gap, this.w, this.h);
                }
            },
            update() {
                if(state.current !== state.game) return;
                if(frames % 100 === 0) {
                    this.position.push({ x: canvas.width, y: this.h * (Math.random() - 1) + 50, passed: false });
                }
                for(let i=0; i<this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= this.dx;
                    let bottomPipeYPos = p.y + this.h + this.gap;
                    let bx = bird.x - bird.radius + 2, br = bird.x + bird.radius - 2;
                    let by = bird.y - bird.radius + 2, bb = bird.y + bird.radius - 2;

                    if(br > p.x && bx < p.x + this.w) {
                        if(by < p.y + this.h || bb > bottomPipeYPos) {
                            state.current = state.over;
                            playSfx(audio.hit);
                            setTimeout(() => playSfx(audio.die), 300);
                        }
                    }
                    if(p.x + this.w < bird.x - bird.radius && !p.passed) {
                        score.value += 1;
                        p.passed = true;
                        playSfx(audio.point);
                        scoreDisplay.innerText = score.value;
                        score.best = Math.max(score.value, score.best);
                        localStorage.setItem('flappy_best', score.best);
                    }
                    if(p.x + this.w <= 0) {
                        this.position.shift();
                        i--;
                    }
                }
            },
            reset() { this.position = []; }
        };

        const ui = {
            draw() {
                if(state.current === state.getReady) {
                    drawImg(sprites.getReady, canvas.width/2 - 184/2, canvas.height/2 - 267/2 - 50, 184, 267);
                    scoreDisplay.innerText = "";
                }
                if(state.current === state.over) {
                    drawImg(sprites.gameOver, canvas.width/2 - 192/2, 100, 192, 42);
                    scoreDisplay.innerText = "";
                    ctx.fillStyle = '#ded895';
                    ctx.fillRect(canvas.width/2 - 110, 160, 220, 110);
                    ctx.strokeStyle = '#543847';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(canvas.width/2 - 110, 160, 220, 110);
                    ctx.fillStyle = '#f48024';
                    ctx.font = '20px "FlappyFont", monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText('SCORE', canvas.width/2 + 90, 190);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(score.value, canvas.width/2 + 90, 215);
                    ctx.fillStyle = '#f48024';
                    ctx.fillText('BEST', canvas.width/2 + 90, 245);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(score.best, canvas.width/2 + 90, 270);
                }
            }
        };

        // --- MAIN LOOP ---
        function loop() {
            ctx.fillStyle = '#4ec0ca';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            bg.draw();
            pipes.draw();
            ground.draw();
            bird.draw();
            ui.draw();

            bg.update();
            pipes.update();
            ground.update();
            bird.update();

            frames++;
            requestAnimationFrame(loop);
        }

        // --- CONTROLS ---
        function handleInput(e) {
            if(e.type === 'keydown' && e.code !== 'Space') return;
            switch(state.current) {
                case state.getReady:
                    state.current = state.game;
                    playSfx(audio.swoosh);
                    bird.flap();
                    scoreDisplay.innerText = score.value;
                    break;
                case state.game:
                    bird.flap();
                    break;
                case state.over:
                    bird.reset();
                    pipes.reset();
                    score.value = 0;
                    playSfx(audio.swoosh);
                    state.current = state.getReady;
                    break;
            }
        }

        window.addEventListener('keydown', handleInput);
        canvas.addEventListener('pointerdown', handleInput);

        // Start immediately. The Safe-Draw function will pop the images in as soon as they bypass Discord's security.
        loadingText.style.display = 'none';
        loop();
    </script>
</body>
</html>
