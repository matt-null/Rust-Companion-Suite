<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Discord Activity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #70c5ce;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        #overlay h1 {
            font-size: 2.5rem;
            color: #ffca28;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 10px;
        }

        #overlay p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #e0e0e0;
            text-shadow: 1px 1px 0 #000;
            text-align: center;
        }

        .btn {
            background: #43b581;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2e7d32;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2e7d32;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 5;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">
            <div>SCORE: <span id="current-score">0</span></div>
            <div>BEST: <span id="high-score">0</span></div>
        </div>

        <canvas id="canvas" width="320" height="480"></canvas>

        <div id="overlay">
            <h1 id="title">FLAPPY BIRD 🐥</h1>
            <p id="sub">Click, Tap, or Press Space to Jump!</p>
            <button class="btn" id="start-btn" onclick="startGame()">PLAY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('current-score');
        const bestEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const titleEl = document.getElementById('title');
        const subEl = document.getElementById('sub');
        const startBtn = document.getElementById('start-btn');

        let audioCtx = null;
        function playJumpSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e){}
        }

        let state = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('fb_high') || 0;
        bestEl.innerText = highScore;

        let frames = 0;
        const gravity = 0.25;
        const jump = -4.6;

        const bird = {
            x: 50,
            y: 150,
            radius: 12,
            velocity: 0,
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.min(Math.PI/4, Math.max(-Math.PI/4, this.velocity * 0.1)));
                
                // Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeb3b';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();

                // Eye
                ctx.beginPath();
                ctx.arc(4, -4, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, -4, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();

                // Beak
                ctx.beginPath();
                ctx.fillStyle = '#ff9800';
                ctx.fillRect(8, 0, 8, 5);
                ctx.strokeRect(8, 0, 8, 5);

                ctx.restore();
            },
            flap() {
                this.velocity = jump;
                playJumpSound();
            },
            update() {
                this.velocity += gravity;
                this.y += this.velocity;

                if (this.y + this.radius >= canvas.height - 40) {
                    this.y = canvas.height - 40 - this.radius;
                    gameOver();
                }
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },
            reset() {
                this.y = 150;
                this.velocity = 0;
            }
        };

        const pipes = {
            items: [],
            gap: 100,
            dx: 2,
            draw() {
                ctx.fillStyle = '#75c044';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;

                for (let p of this.items) {
                    // Top pipe
                    ctx.fillRect(p.x, 0, 40, p.top);
                    ctx.strokeRect(p.x, 0, 40, p.top);
                    // Bottom pipe
                    let bottomY = p.top + this.gap;
                    let bottomH = canvas.height - 40 - bottomY;
                    ctx.fillRect(p.x, bottomY, 40, bottomH);
                    ctx.strokeRect(p.x, bottomY, 40, bottomH);
                }
            },
            update() {
                if (frames % 100 === 0) {
                    let maxTop = canvas.height - 40 - this.gap - 40;
                    let topH = Math.floor(Math.random() * (maxTop - 40)) + 40;
                    this.items.push({ x: canvas.width, top: topH, passed: false });
                }

                for (let p of this.items) {
                    p.x -= this.dx;

                    // Collision check
                    if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 40) {
                        if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.top + this.gap) {
                            gameOver();
                        }
                    }

                    // Score check
                    if (!p.passed && p.x + 40 < bird.x) {
                        p.passed = true;
                        score++;
                        scoreEl.innerText = score;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('fb_high', highScore);
                            bestEl.innerText = highScore;
                        }
                    }
                }

                this.items = this.items.filter(p => p.x + 40 > 0);
            },
            reset() {
                this.items = [];
            }
        };

        function drawGround() {
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = '#73c23e';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, canvas.height - 40, canvas.width, 40);
        }

        function loop() {
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (state === 'PLAYING') {
                bird.update();
                pipes.update();
                frames++;
            }

            pipes.draw();
            drawGround();
            bird.draw();

            requestAnimationFrame(loop);
        }

        function startGame() {
            state = 'PLAYING';
            score = 0;
            scoreEl.innerText = score;
            bird.reset();
            pipes.reset();
            frames = 0;
            overlay.style.display = 'none';
        }

        function gameOver() {
            state = 'GAMEOVER';
            titleEl.innerText = 'GAME OVER';
            subEl.innerText = `Final Score: ${score}`;
            startBtn.innerText = 'TRY AGAIN';
            overlay.style.display = 'flex';
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (state === 'PLAYING') bird.flap();
                else if (overlay.style.display !== 'none') startGame();
            }
        });

        canvas.addEventListener('pointerdown', () => {
            if (state === 'PLAYING') bird.flap();
        });

        loop();
    </script>
</body>
</html>
