<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden select-none">

    <div class="text-center mb-3">
        <h1 class="text-3xl md:text-4xl font-extrabold text-yellow-400 drop-shadow-[0_3px_3px_rgba(0,0,0,0.8)] tracking-wide">
            🐤 FLAPPY BIRD 🐤
        </h1>
        <p class="text-slate-300 text-sm mt-1">Tap, Click, or press Spacebar to flap!</p>
    </div>

    <div class="relative w-full max-w-md aspect-[2/3] max-h-[70vh] flex justify-center items-center">
        <canvas id="gameCanvas" class="w-full h-full bg-sky-300"></canvas>
        
        <!-- Start / Game Over Screen -->
        <div id="uiOverlay" class="absolute inset-0 bg-black/40 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-white text-center transition-opacity duration-200">
            <h2 id="uiTitle" class="text-4xl font-black text-yellow-300 mb-2 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                GET READY!
            </h2>
            <p id="uiSubtitle" class="text-lg text-slate-100 mb-6 font-semibold">
                Tap or Press Space to Start
            </p>

            <div class="bg-white/20 backdrop-blur-md rounded-xl p-4 w-48 mb-6 border border-white/30 space-y-2">
                <div class="flex justify-between items-center text-sm font-bold">
                    <span>SCORE</span>
                    <span id="finalScore" class="text-yellow-300 text-xl">0</span>
                </div>
                <div class="flex justify-between items-center text-sm font-bold">
                    <span>BEST</span>
                    <span id="highScore" class="text-emerald-400 text-xl">0</span>
                </div>
            </div>

            <button id="startBtn" class="bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 active:scale-95 text-slate-900 font-extrabold text-xl px-8 py-3 rounded-full shadow-lg border-2 border-amber-200 transition-all cursor-pointer">
                PLAY NOW!
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const uiOverlay = document.getElementById('uiOverlay');
        const uiTitle = document.getElementById('uiTitle');
        const uiSubtitle = document.getElementById('uiSubtitle');
        const finalScoreEl = document.getElementById('finalScore');
        const highScoreEl = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');

        // High Score Storage
        let highScore = localStorage.getItem('flappy_high_score') || 0;
        highScoreEl.innerText = highScore;

        // Resize Canvas dynamically
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Web Audio API Synth for Sound Effects (No external assets needed!)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'score') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) {}
        }

        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
        let frames = 0;
        let score = 0;

        // Bird Settings
        const bird = {
            x: 50,
            y: 150,
            radius: 14,
            velocity: 0,
            gravity: 0.35,
            jumpStrength: -6.8,
            rotation: 0,

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Body (Yellow Circle)
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#facc15';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#854d0e';
                ctx.stroke();

                // Wing (Orange)
                ctx.beginPath();
                ctx.ellipse(-4, 2, 8, 5, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fb923c';
                ctx.fill();
                ctx.stroke();

                // Eye (White + Black pupil)
                ctx.beginPath();
                ctx.arc(6, -5, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8, -5, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();

                // Beak (Red/Orange)
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(18, 4);
                ctx.lineTo(10, 8);
                ctx.closePath();
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },

            update() {
                if (gameState === 'PLAYING') {
                    this.velocity += this.gravity;
                    this.y += this.velocity;

                    // Rotation logic
                    if (this.velocity < 0) {
                        this.rotation = Math.max(-0.4, this.rotation - 0.1);
                    } else {
                        this.rotation = Math.min(0.8, this.rotation + 0.05);
                    }

                    // Bottom Collision
                    if (this.y + this.radius >= canvas.height - 40) {
                        this.y = canvas.height - 40 - this.radius;
                        gameOver();
                    }

                    // Top Ceiling Constraint
                    if (this.y - this.radius <= 0) {
                        this.y = this.radius;
                        this.velocity = 0;
                    }
                } else if (gameState === 'START') {
                    // Hover effect on start screen
                    this.y = (canvas.height / 2) + Math.sin(frames * 0.08) * 8;
                    this.rotation = 0;
                }
            },

            jump() {
                this.velocity = this.jumpStrength;
                playSound('jump');
            }
        };

        const pipes = [];
        const pipeWidth = 52;
        const pipeGap = 125;

        function spawnPipe() {
            const minHeight = 40;
            const maxHeight = canvas.height - 40 - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function updatePipes() {
            if (frames % 100 === 0) {
                spawnPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= 2;

                // Collision Detection
                const birdRight = bird.x + bird.radius;
                const birdLeft = bird.x - bird.radius;
                const birdTop = bird.y - bird.radius;
                const birdBottom = bird.y + bird.radius;

                if (birdRight > p.x && birdLeft < p.x + pipeWidth) {
                    if (birdTop < p.topHeight || birdBottom > p.bottomY) {
                        gameOver();
                    }
                }

                // Check Score
                if (!p.passed && p.x + pipeWidth < bird.x) {
                    p.passed = true;
                    score++;
                    playSound('score');
                }

                // Remove offscreen pipes
                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function drawPipes() {
            pipes.forEach(p => {
                // Top Pipe Gradient
                const topGrad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                topGrad.addColorStop(0, '#22c55e');
                topGrad.addColorStop(0.5, '#4ade80');
                topGrad.addColorStop(1, '#15803d');

                ctx.fillStyle = topGrad;
                ctx.strokeStyle = '#14532d';
                ctx.lineWidth = 2;

                // Top Pipe Body
                ctx.fillRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.strokeRect(p.x, 0, pipeWidth, p.topHeight);
                // Top Pipe Cap
                ctx.fillRect(p.x - 3, p.topHeight - 16, pipeWidth + 6, 16);
                ctx.strokeRect(p.x - 3, p.topHeight - 16, pipeWidth + 6, 16);

                // Bottom Pipe Body
                const bottomHeight = canvas.height - 40 - p.bottomY;
                ctx.fillRect(p.x, p.bottomY, pipeWidth, bottomHeight);
                ctx.strokeRect(p.x, p.bottomY, pipeWidth, bottomHeight);
                // Bottom Pipe Cap
                ctx.fillRect(p.x - 3, p.bottomY, pipeWidth + 6, 16);
                ctx.strokeRect(p.x - 3, p.bottomY, pipeWidth + 6, 16);
            });
        }

        function drawBackground() {
            // Sky
            ctx.fillStyle = '#7dd3fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Clouds
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(60 - (frames * 0.2) % (canvas.width + 100), 80, 20, 0, Math.PI * 2);
            ctx.arc(80 - (frames * 0.2) % (canvas.width + 100), 70, 25, 0, Math.PI * 2);
            ctx.arc(105 - (frames * 0.2) % (canvas.width + 100), 80, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(260 - (frames * 0.3) % (canvas.width + 100), 120, 18, 0, Math.PI * 2);
            ctx.arc(280 - (frames * 0.3) % (canvas.width + 100), 110, 22, 0, Math.PI * 2);
            ctx.arc(300 - (frames * 0.3) % (canvas.width + 100), 120, 18, 0, Math.PI * 2);
            ctx.fill();

            // Ground & Grass
            const groundY = canvas.height - 40;
            ctx.fillStyle = '#16a34a'; // Grass
            ctx.fillRect(0, groundY, canvas.width, 12);

            ctx.fillStyle = '#b45309'; // Dirt
            ctx.fillRect(0, groundY + 12, canvas.width, 28);

            // Animated Ground Stripes
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 3;
            const stripeOffset = (frames * 2) % 16;
            for (let x = -16; x < canvas.width + 16; x += 16) {
                ctx.beginPath();
                ctx.moveTo(x - stripeOffset, groundY + 12);
                ctx.lineTo(x - stripeOffset - 8, canvas.height);
                ctx.stroke();
            }
        }

        function drawScore() {
            if (gameState === 'PLAYING') {
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.font = '900 36px "Arial", sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeText(score, canvas.width / 2, 60);
                ctx.fillText(score, canvas.width / 2, 60);
            }
        }

        function triggerFlap() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }

            if (gameState === 'START') {
                gameState = 'PLAYING';
                uiOverlay.classList.add('opacity-0', 'pointer-events-none');
                bird.jump();
            } else if (gameState === 'PLAYING') {
                bird.jump();
            } else if (gameState === 'GAMEOVER') {
                resetGame();
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSound('hit');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_high_score', highScore);
            }

            uiTitle.innerText = "GAME OVER!";
            uiSubtitle.innerText = "Nice try! Tap to play again.";
            finalScoreEl.innerText = score;
            highScoreEl.innerText = highScore;
            startBtn.innerText = "TRY AGAIN";
            
            uiOverlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function resetGame() {
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes.length = 0;
            score = 0;
            frames = 0;
            gameState = 'PLAYING';
            uiOverlay.classList.add('opacity-0', 'pointer-events-none');
            bird.jump();
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerFlap();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerFlap();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (gameState === 'PLAYING') {
                triggerFlap();
            }
        });

        startBtn.addEventListener('click', () => {
            triggerFlap();
        });

        function gameLoop() {
            frames++;

            drawBackground();

            if (gameState === 'PLAYING') {
                updatePipes();
            }
            
            drawPipes();
            bird.update();
            bird.draw();
            drawScore();

            requestAnimationFrame(gameLoop);
        }

        // Start Loop
        gameLoop();
    </script>
</body>
</html>
